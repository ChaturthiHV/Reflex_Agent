<svg viewBox="0 0 1000 610" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4338ca"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect width="1000" height="610" fill="#f8fafc"/>

  <!-- User Goal -->
  <rect x="370" y="20" width="260" height="48" rx="10" fill="#0f172a"/>
  <text x="500" y="49" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="600">User Goal</text>
  <line x1="500" y1="68" x2="500" y2="106" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Orchestrator -->
  <rect x="355" y="108" width="290" height="60" rx="10" fill="#4338ca"/>
  <text x="500" y="133" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Orchestrator</text>
  <text x="500" y="153" text-anchor="middle" fill="#c7d2fe" font-size="11">plan → act → observe → evaluate → replan</text>

  <!-- Fan-out arrows to agents -->
  <line x1="405" y1="168" x2="160" y2="216" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="168" x2="390" y2="216" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="168" x2="615" y2="216" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="595" y1="168" x2="840" y2="216" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Literature Agent -->
  <rect x="50" y="220" width="210" height="95" rx="10" fill="#0ea5e9"/>
  <text x="155" y="250" text-anchor="middle" fill="white" font-size="14" font-weight="700">Literature Agent</text>
  <text x="155" y="271" text-anchor="middle" fill="#e0f2fe" font-size="11">find relevant</text>
  <text x="155" y="286" text-anchor="middle" fill="#e0f2fe" font-size="11">approaches (arXiv)</text>

  <!-- Methodology Agent -->
  <rect x="280" y="220" width="210" height="95" rx="10" fill="#7c3aed"/>
  <text x="385" y="250" text-anchor="middle" fill="white" font-size="14" font-weight="700">Methodology Agent</text>
  <text x="385" y="271" text-anchor="middle" fill="#ede9fe" font-size="11">propose approach</text>
  <text x="385" y="286" text-anchor="middle" fill="#ede9fe" font-size="11">+ confidence score</text>

  <!-- Experiment Agent -->
  <rect x="510" y="220" width="210" height="95" rx="10" fill="#059669"/>
  <text x="615" y="250" text-anchor="middle" fill="white" font-size="14" font-weight="700">Experiment Agent</text>
  <text x="615" y="271" text-anchor="middle" fill="#d1fae5" font-size="11">run it for real,</text>
  <text x="615" y="286" text-anchor="middle" fill="#d1fae5" font-size="11">measure the result</text>

  <!-- Failure Agent -->
  <rect x="740" y="220" width="210" height="95" rx="10" fill="#ea580c"/>
  <text x="845" y="250" text-anchor="middle" fill="white" font-size="14" font-weight="700">Failure Agent</text>
  <text x="845" y="271" text-anchor="middle" fill="#ffedd5" font-size="11">diagnose failure,</text>
  <text x="845" y="286" text-anchor="middle" fill="#ffedd5" font-size="11">write a lesson</text>

  <!-- Memory store (cylinder) -->
  <path d="M 275 400 L 275 445 A 110 15 0 0 0 495 445 L 495 400" fill="#334155" stroke="#1e293b" stroke-width="1"/>
  <ellipse cx="385" cy="400" rx="110" ry="15" fill="#475569" stroke="#1e293b" stroke-width="1"/>
  <text x="385" y="428" text-anchor="middle" fill="white" font-size="12" font-weight="600">memory/lessons.json</text>

  <!-- Methodology reads from memory -->
  <line x1="385" y1="315" x2="385" y2="382" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowPurple)"/>
  <text x="320" y="352" fill="#7c3aed" font-size="10" font-weight="600">read lessons</text>

  <!-- Failure writes to memory -->
  <path d="M 845 315 C 845 400, 610 440, 500 440" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowOrange)"/>
  <text x="660" y="425" fill="#ea580c" font-size="10" font-weight="600">write lesson</text>

  <!-- Loop back to Orchestrator -->
  <path d="M 950 218 C 995 140, 900 90, 648 122" fill="none" stroke="#4338ca" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowIndigo)"/>
  <text x="870" y="150" text-anchor="middle" fill="#4338ca" font-size="11" font-weight="700">loop: replan with lesson</text>

  <!-- Exit to Human Handoff -->
  <path d="M 358 135 C 130 135, 25 320, 25 500 C 25 545, 200 548, 365 545" fill="none" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arrowTeal)"/>
  <text x="35" y="300" fill="#0f766e" font-size="10" font-weight="600" transform="rotate(-90 35 300)">target met · confidence too low · attempts exhausted</text>

  <!-- Human Handoff -->
  <rect x="370" y="518" width="260" height="60" rx="10" fill="#0f766e"/>
  <text x="500" y="545" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Human Handoff</text>
  <text x="500" y="563" text-anchor="middle" fill="#ccfbf1" font-size="10">full reasoning trace attached</text>
</svg>
